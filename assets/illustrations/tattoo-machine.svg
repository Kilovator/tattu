<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Frame -->
  <path d="M120 280 L120 180 Q120 120 180 120 L260 120 L260 160 L180 160 Q160 160 160 180 L160 280 Z" fill="#111111" stroke="#888888" stroke-width="4"/>
  <!-- Coils -->
  <rect x="180" y="180" width="35" height="60" rx="5" fill="#222222" stroke="#aaaaaa" stroke-width="3"/>
  <line x1="180" y1="195" x2="215" y2="195" stroke="#cc9933" stroke-width="2"/>
  <line x1="180" y1="210" x2="215" y2="210" stroke="#cc9933" stroke-width="2"/>
  <line x1="180" y1="225" x2="215" y2="225" stroke="#cc9933" stroke-width="2"/>

  <rect x="230" y="180" width="35" height="60" rx="5" fill="#222222" stroke="#aaaaaa" stroke-width="3"/>
  <line x1="230" y1="195" x2="265" y2="195" stroke="#cc9933" stroke-width="2"/>
  <line x1="230" y1="210" x2="265" y2="210" stroke="#cc9933" stroke-width="2"/>
  <line x1="230" y1="225" x2="265" y2="225" stroke="#cc9933" stroke-width="2"/>

  <!-- Armature Bar & Spring -->
  <path d="M150 150 L280 150 L280 165 L170 165" fill="#555555" stroke="#ffffff" stroke-width="2"/>
  <path d="M140 170 Q145 130 170 145" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- Contact Screw -->
  <line x1="270" y1="100" x2="270" y2="150" stroke="#ffd700" stroke-width="5"/>
  <circle cx="270" cy="90" r="12" fill="#333333" stroke="#ffd700" stroke-width="3"/>

  <!-- Tube Clamp & Grip -->
  <rect x="100" y="280" width="50" height="30" rx="4" fill="#333333" stroke="#aaaaaa" stroke-width="3"/>
  <circle cx="80" cy="295" r="10" stroke="#aaaaaa" stroke-width="3"/>

  <!-- Tube & Grip -->
  <path d="M115 310 L95 380 L135 380 L135 310 Z" fill="#222222" stroke="#ffffff" stroke-width="3"/>
  <line x1="105" y1="330" x2="130" y2="330" stroke="#888888" stroke-width="2"/>
  <line x1="100" y1="350" x2="132" y2="350" stroke="#888888" stroke-width="2"/>
  <line x1="98" y1="370" x2="134" y2="370" stroke="#888888" stroke-width="2"/>

  <!-- Needle Tip -->
  <path d="M105 380 L115 410 L125 380" fill="#aaaaaa" stroke="#ffffff" stroke-width="2"/>
  <line x1="115" y1="380" x2="115" y2="418" stroke="#ffffff" stroke-width="2"/>

  <!-- Clip cord & artistic shading -->
  <path d="M200 240 Q190 320 280 340" stroke="#666666" stroke-width="4" stroke-dasharray="6 4" fill="none"/>
  <!-- Geometric linework decoration -->
  <circle cx="200" cy="200" r="180" stroke="#444444" stroke-width="1" stroke-dasharray="10 10" opacity="0.4" fill="none"/>
  <polygon points="200,20 380,200 200,380 20,200" stroke="#333333" stroke-width="1" opacity="0.3" fill="none"/>
</svg>